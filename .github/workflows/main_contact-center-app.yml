name: Build and deploy Node.js app to Azure Web App - contact-center-web

on:
  push:
    branches:
      - main
  # Validate pull requests BEFORE they are merged. Until now the only
  # trigger was a push to main, which is also what deploys - so lint,
  # typecheck, tests and the build were first exercised AFTER the change
  # had already gone to production. The deploy job is hard-gated below so a
  # pull_request event can never reach Azure.
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit so the dependency check below can diff
          # package.json against it.
          fetch-depth: 2

      - name: Warn if runtime dependencies changed
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "No parent commit available; skipping dependency check."
            exit 0
          fi
          git show HEAD~1:package.json > /tmp/pkg-before.json 2>/dev/null || echo '{}' > /tmp/pkg-before.json
          node -e '
            const fs = require("fs");
            const keys = (f) => {
              try { return Object.keys(JSON.parse(fs.readFileSync(f, "utf8")).dependencies || {}); }
              catch { return []; }
            };
            const before = keys("/tmp/pkg-before.json");
            const after = keys("package.json");
            const added = after.filter((d) => !before.includes(d));
            const removed = before.filter((d) => !after.includes(d));
            if (!added.length && !removed.length) {
              console.log("No runtime dependency changes.");
              process.exit(0);
            }
            if (added.length) console.log("Added:   " + added.join(", "));
            if (removed.length) console.log("Removed: " + removed.join(", "));
            if (added.length) {
              console.log("::warning title=Runtime dependency added::" + added.join(", ") +
                " - this App Service starts from a stale wwwroot/node_modules and IGNORES the" +
                " node_modules this workflow ships, so a newly added package is missing at" +
                " runtime and the app exits with ERR_MODULE_NOT_FOUND (site returns 503)." +
                " Read docs/DEPLOYMENT.md before merging this.");
            }
          '

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run lint

      # Regression tests. These pin behaviour that has broken in production
      # before - a CSR being unable to re-book a shift they cancelled, and
      # schedule saves deleting other people's shifts and their confirmed
      # bookings. A red run here must block the deploy.
      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build --if-present

      # Everything below only matters for a real deploy. On a pull request the
      # run stops after install + lint + test + build, which is the fast
      # feedback a PR wants.
      - name: Keep only production dependencies
        if: github.event_name != 'pull_request'
        run: npm prune --omit=dev

      - name: Create deployment package
        if: github.event_name != 'pull_request'
        run: |
          rm -rf release release.zip
          mkdir -p release
          cp package.json package-lock.json server.ts knexfile.ts startup.sh release/
          cp -r dist src node_modules release/
          # Stamps the package with the commit it was built from. server.ts
          # reports this at /api/health, and the verify step below polls until
          # the running app reports THIS sha - which is what proves the app
          # actually restarted into the new build.
          printf '{"commit":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release/build-info.json
          [ -f tsconfig.json ] && cp tsconfig.json release/
          cd release
          zip -rq ../release.zip .

      - name: Verify deployment package
        if: github.event_name != 'pull_request'
        run: |
          test -f release/build-info.json
          grep -q "$GITHUB_SHA" release/build-info.json
          test -f release/node_modules/express/package.json
          test -f release/node_modules/tsx/dist/cli.mjs
          test -f release/startup.sh
          test -d release/src/database/migrations
          unzip -l release.zip | grep "node_modules/express/package.json"
          unzip -l release.zip | grep "node_modules/tsx/dist/cli.mjs"
          unzip -l release.zip | grep "startup.sh"
          unzip -l release.zip | grep "src/database/migrations"

      - name: Upload artifact for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  # contact-center-web IS production, as of 2026-09-21.
  #
  # The previous App Service, contact-center-app, had a wwwroot/node_modules
  # frozen at 2026-06-07 that no deploy could refresh, so adding any npm
  # dependency took the site down at runtime while the deploy reported success
  # (docs/DEPLOYMENT.md). This app was created to escape that, and does:
  # /api/health reported "compression" loadable here and not loadable there,
  # from one build, before the switch.
  #
  # The old app is STOPPED, not deleted, and its deploy job was removed with
  # it. To roll back: start contact-center-app in the Portal - it still holds
  # the last build it received - and restore the job from git history
  # (the commit that removed it names this line). Both apps read the same
  # Azure SQL database, so no data moves either way.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    # HARD GATE. The workflow now also runs on pull_request, and a pull
    # request must NEVER be able to deploy to production. An explicit
    # allow-list of the two events that may deploy - not a `!=` - so that
    # adding a future trigger cannot silently grant deploy rights.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2173911DA914492EB087514A55CBE992 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_873A5F2F2D8D4C7FA4177ECEDBA6B7AF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E5835CD4576B4CF9B70BE79743DEC99D }}

      - name: Check and enable Always On (prevents cold-start login errors)
        continue-on-error: true
        run: |
          RG=$(az webapp list --query "[?name=='contact-center-web'].resourceGroup" -o tsv)
          echo "Resource group: $RG"
          echo "--- Always On BEFORE ---"
          az webapp config show --name contact-center-web --resource-group "$RG" --query "alwaysOn" -o tsv
          echo "--- App Service Plan tier ---"
          PLAN_ID=$(az webapp show --name contact-center-web --resource-group "$RG" --query "appServicePlanId" -o tsv)
          az appservice plan show --ids "$PLAN_ID" --query "{tier:sku.tier, name:sku.name}" -o table
          echo "--- Attempting to enable Always On ---"
          az webapp config set --name contact-center-web --resource-group "$RG" --always-on true || echo "FAILED - likely unsupported on this tier (e.g. Free F1). See tier above."
          echo "--- Always On AFTER ---"
          az webapp config show --name contact-center-web --resource-group "$RG" --query "alwaysOn" -o tsv

      # Two runs have now ended with "503, go read Log stream by hand". The
      # container's own stderr is the one place the reason is written, and
      # nothing in this workflow has ever printed it. Turn filesystem logging
      # on BEFORE the deploy so the crash is captured, and print it in the
      # failure step below. Costs nothing when the deploy works.
      - name: Turn on filesystem logging (so a crash leaves a trace)
        continue-on-error: true
        run: |
          RG=$(az webapp list --query "[?name=='contact-center-web'].resourceGroup" -o tsv)
          az webapp log config --name contact-center-web --resource-group "$RG" \
            --application-logging filesystem --docker-container-logging filesystem \
            --level verbose -o none

      # appCommandLine does not survive quoting. Setting it to
      #     bash -c 'cd /home/site/wwwroot && node ... server.ts'
      # reached the container as "bash -c cd" - the quotes were lost and
      # everything after the first word was dropped, so the process exited 0
      # immediately and the site never came up.
      #
      # So the command is one word-splitting-safe invocation of a script that
      # ships in the package, where the real logic lives and can be reviewed:
      # startup.sh. It waits for node_modules to be extracted and avoids the
      # broken .bin shim. See that file, and docs/DEPLOYMENT.md.
      - name: Set an explicit startup command
        continue-on-error: true
        run: |
          RG=$(az webapp list --query "[?name=='contact-center-web'].resourceGroup" -o tsv)
          az webapp config set --name contact-center-web --resource-group "$RG" \
            --startup-file "bash /home/site/wwwroot/startup.sh" -o none
          echo "appCommandLine is now:"
          az webapp config show --name contact-center-web --resource-group "$RG" \
            --query "appCommandLine" -o tsv

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'contact-center-web'
          slot-name: 'Production'
          package: release.zip

      # This app is the whole point: a wwwroot that has never been written to,
      # so the deploy should replace node_modules instead of leaving June's
      # copy in place (docs/DEPLOYMENT.md, docs/APP-SERVICE-MIGRATION.md).
      # Proving that is step 6 of the migration - add a dependency and see
      # whether this app still answers.

      # "Successfully deployed" only means the files arrived. It says nothing
      # about whether the process actually started. On 2026-09-16 a deploy
      # reported success while the app was crash-looping on startup, and the
      # outage was only noticed hours later. This step closes that gap: if the
      # app does not answer /api/health, the run goes red within minutes.
      - name: Verify the app actually came back up
        run: |
          set -u
          RG=$(az webapp list --query "[?name=='contact-center-web'].resourceGroup" -o tsv)
          HOST=$(az webapp show --name contact-center-web --resource-group "$RG" --query defaultHostName -o tsv)
          URL="https://${HOST}/api/health"
          echo "Polling ${URL} for up to 5 minutes, waiting for commit ${GITHUB_SHA}..."

          SAW_OLD_BUILD=0

          for i in $(seq 1 30); do
            # Clear the body file first, so a failure never reports a stale
            # body left over from an earlier attempt as if it were current.
            rm -f /tmp/health.json
            # curl already prints 000 to stdout when it cannot connect, so use
            # `|| true` rather than appending another 000 to it.
            CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$URL" 2>/dev/null || true)
            CODE=${CODE:-000}

            if [ "$CODE" = "200" ]; then
              # A 200 is NOT enough on its own. App Service takes 30-60s to
              # restart into the uploaded package, so for that window the old
              # process is still answering - on 2026-09-17 this check passed
              # six seconds after upload, against the previous build. Wait
              # until the app reports the commit we just shipped.
              RUNNING=$(jq -r '.commit // empty' /tmp/health.json 2>/dev/null || true)

              if [ "$RUNNING" = "$GITHUB_SHA" ]; then
                echo "App is healthy AND running this build after ~$((i * 10))s:"
                cat /tmp/health.json; echo
                exit 0
              fi

              SAW_OLD_BUILD=1
              if [ -z "$RUNNING" ]; then
                echo "[$i/30] HTTP 200 but no commit reported - still the pre-build-stamp process, waiting for restart"
              else
                echo "[$i/30] HTTP 200 but running ${RUNNING} - waiting for restart into ${GITHUB_SHA}"
              fi
            else
              echo "[$i/30] HTTP ${CODE} - not healthy yet, retrying in 10s"
            fi
            sleep 10
          done

          echo "Last response body (if any):"
          if [ -s /tmp/health.json ]; then cat /tmp/health.json; echo; else echo "(no response body - the app did not answer at all)"; fi

          if [ "$SAW_OLD_BUILD" = "1" ]; then
            echo "::error title=Deploy did not take effect::${URL} answers, but never reported commit ${GITHUB_SHA} within 5 minutes. The package uploaded but the app did not restart into it - it is still serving the previous build, or the new one is crash-looping and App Service kept the old process. Check Log stream (Azure Portal -> contact-center-web -> Log stream) and see docs/DEPLOYMENT.md. Roll back with: git revert <this commit> && git push"
          else
            echo "::error title=Deploy did not come up::The package deployed but ${URL} never returned 200 within 5 minutes. The app is very likely crash-looping - check Log stream (Azure Portal -> contact-center-web -> Log stream) and see docs/DEPLOYMENT.md. Roll back with: git revert <this commit> && git push"
          fi
          exit 1

      # Runs only when something above failed - normally the verify step. It
      # answers the question the verify step can only ask: WHY the process is
      # not there. Four things, cheapest first:
      #   1. the startup command and runtime, which differ between a fresh
      #      App Service and one configured by hand years ago
      #   2. the values of the build-related settings (the names alone say
      #      nothing - SCM_DO_BUILD_DURING_DEPLOYMENT=true makes Oryx run its
      #      own npm install over the node_modules the package shipped)
      #   3. the Oryx build output, if a build ran
      #   4. the container log - the actual stack trace
      # azure/login's client assertion is valid for five minutes. By now a
      # deploy and an eight-minute health poll have gone by, so calls that
      # need a fresh token fail with AADSTS700024 - which is exactly how the
      # live log tail died last run. Cached ARM tokens still work, which is
      # why the earlier az calls in that step succeeded and only the tail did
      # not. Get a new assertion before the diagnostics run.
      - name: Refresh the Azure login before diagnosing
        if: failure()
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2173911DA914492EB087514A55CBE992 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_873A5F2F2D8D4C7FA4177ECEDBA6B7AF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E5835CD4576B4CF9B70BE79743DEC99D }}

      - name: Why did it not start?
        if: failure()
        continue-on-error: true
        run: |
          set -u
          RG=$(az webapp list --query "[?name=='contact-center-web'].resourceGroup" -o tsv)

          echo "=============== 1. Runtime and startup command ==============="
          echo "--- NEW app (contact-center-web) ---"
          az webapp config show --name contact-center-web --resource-group "$RG" \
            --query "{linuxFxVersion:linuxFxVersion, appCommandLine:appCommandLine, alwaysOn:alwaysOn}" \
            -o yaml || true

          # The old app's configuration is printed by the deploy job above:
          # this job's federated credential is scoped to the new resource
          # group, and reading the old app from here returns
          # AuthorizationFailed.

          echo
          echo "=============== 2. Build-related settings ===================="
          az webapp config appsettings list --name contact-center-web --resource-group "$RG" \
            --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT' || name=='ENABLE_ORYX_BUILD' || name=='NODE_ENV' || name=='WEBSITE_NODE_DEFAULT_VERSION' || name=='WEBSITE_RUN_FROM_PACKAGE'].{name:name,value:value}" \
            -o table || true

          echo
          echo "=============== 3. Last deployment (Oryx build) =============="
          az webapp log deployment show --name contact-center-web --resource-group "$RG" 2>/dev/null \
            | tail -c 16000 || echo "(no deployment log)"

          echo
          # Streaming beats downloading. The download returned nothing at all
          # on the first diagnostic run - filesystem logging had been on for
          # minutes, not hours, and the archive was empty. Tailing the docker
          # provider reads the live stream instead, and restarting the app
          # underneath the tail guarantees a fresh boot lands in it. The
          # download stays as a fallback in case the tail is not permitted.
          echo "=============== 4. Container log, live (the crash) =========="
          rm -f /tmp/tail.log
          ( az webapp log tail --name contact-center-web --resource-group "$RG" \
              --provider docker > /tmp/tail.log 2>&1 & echo $! > /tmp/tail.pid ) || true
          sleep 8
          echo "(restarting the app so a fresh startup lands in the stream)"
          az webapp restart --name contact-center-web --resource-group "$RG" -o none || true
          sleep 110
          [ -f /tmp/tail.pid ] && kill "$(cat /tmp/tail.pid)" 2>/dev/null || true
          if [ -s /tmp/tail.log ]; then
            tail -n 250 /tmp/tail.log
          else
            echo "(the live stream produced nothing)"
          fi

          echo
          echo "=============== 5. Container log, downloaded (fallback) ====="
          rm -rf /tmp/applog.zip /tmp/applog
          if az webapp log download --name contact-center-web --resource-group "$RG" \
               --log-file /tmp/applog.zip >/dev/null 2>&1 && [ -s /tmp/applog.zip ]; then
            unzip -qo /tmp/applog.zip -d /tmp/applog || true
            FOUND=0
            # Newest three log files, whatever they are called - the Linux
            # container writes *_docker.log, but the name is not contractual.
            while IFS= read -r f; do
              FOUND=1
              echo "--- ${f#/tmp/applog/} ---"
              tail -n 150 "$f"
              echo
            done < <(find /tmp/applog -type f -name '*.log' -printf '%T@ %p\n' 2>/dev/null \
                       | sort -rn | head -3 | cut -d' ' -f2-)
            [ "$FOUND" = "1" ] || echo "(the archive contained no .log files)"
          else
            echo "(log download failed - filesystem logging may not have been on"
            echo " long enough, or the app has never written a log)"
          fi
