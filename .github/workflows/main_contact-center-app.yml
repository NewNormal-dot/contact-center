name: Build and deploy Node.js app to Azure Web App - contact-center-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit so the dependency check below can diff
          # package.json against it.
          fetch-depth: 2

      - name: Warn if runtime dependencies changed
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "No parent commit available; skipping dependency check."
            exit 0
          fi
          git show HEAD~1:package.json > /tmp/pkg-before.json 2>/dev/null || echo '{}' > /tmp/pkg-before.json
          node -e '
            const fs = require("fs");
            const keys = (f) => {
              try { return Object.keys(JSON.parse(fs.readFileSync(f, "utf8")).dependencies || {}); }
              catch { return []; }
            };
            const before = keys("/tmp/pkg-before.json");
            const after = keys("package.json");
            const added = after.filter((d) => !before.includes(d));
            const removed = before.filter((d) => !after.includes(d));
            if (!added.length && !removed.length) {
              console.log("No runtime dependency changes.");
              process.exit(0);
            }
            if (added.length) console.log("Added:   " + added.join(", "));
            if (removed.length) console.log("Removed: " + removed.join(", "));
            if (added.length) {
              console.log("::warning title=Runtime dependency added::" + added.join(", ") +
                " - this App Service starts from a stale wwwroot/node_modules and IGNORES the" +
                " node_modules this workflow ships, so a newly added package is missing at" +
                " runtime and the app exits with ERR_MODULE_NOT_FOUND (site returns 503)." +
                " Read docs/DEPLOYMENT.md before merging this.");
            }
          '

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run lint

      - name: Build app
        run: npm run build --if-present

      - name: Keep only production dependencies
        run: npm prune --omit=dev

      - name: Create deployment package
        run: |
          rm -rf release release.zip
          mkdir -p release
          cp package.json package-lock.json server.ts knexfile.ts knexfile.mssql.cjs release/
          cp -r dist src node_modules release/
          [ -f tsconfig.json ] && cp tsconfig.json release/
          cd release
          zip -rq ../release.zip .

      - name: Verify deployment package
        run: |
          test -f release/node_modules/express/package.json
          test -f release/node_modules/tsx/dist/cli.mjs
          test -d release/src/database/migrations
          unzip -l release.zip | grep "node_modules/express/package.json"
          unzip -l release.zip | grep "node_modules/tsx/dist/cli.mjs"
          unzip -l release.zip | grep "src/database/migrations"

      # Shipped alongside release.zip because the platform does not let the
      # zip's node_modules reach wwwroot (see the deploy job for the full
      # story). This copy is pushed straight into wwwroot/node_modules over
      # Kudu's zip API. Zipped from INSIDE node_modules so its entries are
      # package directories, which is what extracting into
      # wwwroot/node_modules/ expects.
      - name: Package node_modules for the direct refresh
        run: |
          rm -f node_modules.zip
          (cd node_modules && zip -rq ../node_modules.zip .)
          ls -lh node_modules.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            release.zip
            node_modules.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_75E7311A0A234F78920C8F58457BD0E1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E818FF295088428588714610EB52173C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3CAB9C9898834E3E8B16390FFB73AC89 }}

      - name: Check and enable Always On (prevents cold-start login errors)
        continue-on-error: true
        run: |
          RG=$(az webapp list --query "[?name=='contact-center-app'].resourceGroup" -o tsv)
          echo "Resource group: $RG"
          echo "--- Always On BEFORE ---"
          az webapp config show --name contact-center-app --resource-group "$RG" --query "alwaysOn" -o tsv
          echo "--- App Service Plan tier ---"
          PLAN_ID=$(az webapp show --name contact-center-app --resource-group "$RG" --query "appServicePlanId" -o tsv)
          az appservice plan show --ids "$PLAN_ID" --query "{tier:sku.tier, name:sku.name}" -o table
          echo "--- Attempting to enable Always On ---"
          az webapp config set --name contact-center-app --resource-group "$RG" --always-on true || echo "FAILED - likely unsupported on this tier (e.g. Free F1). See tier above."
          echo "--- Always On AFTER ---"
          az webapp config show --name contact-center-app --resource-group "$RG" --query "alwaysOn" -o tsv

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'contact-center-app'
          slot-name: 'Production'
          package: release.zip

      # --- Root cause of the 2026-09-16 outage; see docs/DEPLOYMENT.md ---
      #
      # OneDeploy hands this app to Oryx, which packs node_modules into a
      # node_modules.tar.gz and leaves wwwroot/node_modules untouched. At
      # startup the generated script extracts that tarball to /node_modules
      # and tries to symlink it over wwwroot/node_modules - but the move that
      # has to happen first always fails, so the symlink misfires and Node
      # goes on resolving packages from wwwroot/node_modules: a real
      # directory frozen at 2026-06-07. Every deploy since June has run
      # June's packages. It stayed invisible until a dependency was added, at
      # which point the app died with ERR_MODULE_NOT_FOUND and served 503s.
      #
      # Two things were tried and did NOT work, both verified on the running
      # instance rather than assumed:
      #   - SCM_DO_BUILD_DURING_DEPLOYMENT=false: it was already false. That
      #     setting governs building from source, not this packing step.
      #   - Deleting oryx-manifest.toml and node_modules.tar.gz before the
      #     deploy: the deploy recreates both, seconds later.
      #
      # So rather than fight the platform for control of node_modules, this
      # writes the correct packages straight into the directory the app
      # actually reads. Kudu's zip API extracts into wwwroot/node_modules,
      # overwriting what is there.
      #
      # This ordering is deliberate: it runs AFTER the deploy (which is what
      # re-freezes things) and BEFORE the health check, and the restart at
      # the end is what makes Node pick the new packages up.
      #
      # It is also the safest shape available here. It only adds and
      # overwrites files in a directory the app already uses, so the failure
      # mode is "nothing changed" - it can never leave the app with no
      # modules at all, which is the trap that stopped us removing
      # wwwroot/node_modules outright (/node_modules was observed EMPTY on a
      # running instance).
      - name: Refresh wwwroot/node_modules with the packages we actually built
        continue-on-error: true
        run: |
          set -u
          if [ ! -s node_modules.zip ]; then
            echo "node_modules.zip missing from the artifact; skipping."
            exit 0
          fi
          ls -lh node_modules.zip

          RG=$(az webapp list --query "[?name=='contact-center-app'].resourceGroup" -o tsv)
          SCM=$(az webapp show --name contact-center-app --resource-group "$RG" \
            --query "enabledHostNames[?contains(@, '.scm.')] | [0]" -o tsv)
          if [ -z "${SCM:-}" ]; then
            echo "Could not resolve the SCM hostname; skipping."
            exit 0
          fi
          echo "SCM host: $SCM"

          CREDS=$(az webapp deployment list-publishing-credentials \
            --name contact-center-app --resource-group "$RG" -o json)
          SCM_USER=$(echo "$CREDS" | jq -r '.publishingUserName')
          SCM_PASS=$(echo "$CREDS" | jq -r '.publishingPassword')
          echo "::add-mask::$SCM_PASS"
          if [ -z "$SCM_USER" ] || [ "$SCM_USER" = "null" ]; then
            echo "No publishing credentials returned (SCM basic auth may be off); skipping."
            exit 0
          fi

          echo "Uploading node_modules into wwwroot/node_modules (this takes a few minutes)..."
          CODE=$(curl -sS -o /tmp/zipput.log -w '%{http_code}' --max-time 900 \
            -X PUT -u "$SCM_USER:$SCM_PASS" \
            -H "Content-Type: application/zip" \
            --data-binary @node_modules.zip \
            "https://$SCM/api/zip/site/wwwroot/node_modules/" || true)
          echo "PUT /api/zip/site/wwwroot/node_modules/ -> HTTP ${CODE:-000}"
          head -c 2000 /tmp/zipput.log 2>/dev/null || true
          echo

          case "${CODE:-000}" in
            2*)
              echo "Upload accepted. Restarting so Node picks the packages up..."
              az webapp restart --name contact-center-app --resource-group "$RG" --output none
              echo "Restart requested."
              ;;
            *)
              echo "::warning title=node_modules refresh failed::Kudu returned HTTP ${CODE:-000}. The app keeps running on whatever it had before - see docs/DEPLOYMENT.md."
              ;;
          esac

      # "Successfully deployed" only means the files arrived. It says nothing
      # about whether the process actually started. On 2026-09-16 a deploy
      # reported success while the app was crash-looping on startup, and the
      # outage was only noticed hours later. This step closes that gap: if the
      # app does not answer /api/health, the run goes red within minutes.
      - name: Verify the app actually came back up
        run: |
          set -u
          RG=$(az webapp list --query "[?name=='contact-center-app'].resourceGroup" -o tsv)
          HOST=$(az webapp show --name contact-center-app --resource-group "$RG" --query defaultHostName -o tsv)
          URL="https://${HOST}/api/health"
          echo "Polling ${URL} for up to 5 minutes..."

          for i in $(seq 1 30); do
            # Clear the body file first, so a failure never reports a stale
            # body left over from an earlier attempt as if it were current.
            rm -f /tmp/health.json
            # curl already prints 000 to stdout when it cannot connect, so use
            # `|| true` rather than appending another 000 to it.
            CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$URL" 2>/dev/null || true)
            CODE=${CODE:-000}
            if [ "$CODE" = "200" ]; then
              echo "App is healthy after ~$((i * 10))s:"
              cat /tmp/health.json; echo
              exit 0
            fi
            echo "[$i/30] HTTP ${CODE} - not healthy yet, retrying in 10s"
            sleep 10
          done

          echo "Last response body (if any):"
          if [ -s /tmp/health.json ]; then cat /tmp/health.json; echo; else echo "(no response body - the app did not answer at all)"; fi
          echo "::error title=Deploy did not come up::The package deployed but ${URL} never returned 200 within 5 minutes. The app is very likely crash-looping - check Log stream (Azure Portal -> contact-center-app -> Log stream) and see docs/DEPLOYMENT.md. Roll back with: git revert <this commit> && git push"
          exit 1